name: terraform

# Runs on PRs and on manual dispatch. Configure repo variables AWS_ROLE_ARN,
# TF_STATE_BUCKET and ALERT_EMAIL before enabling.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after plan"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VAR_env: dev
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    if: vars.AWS_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=data-platform/dev.tfstate" -backend-config="region=us-east-1"
      - name: Validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: tflint --init && tflint
      - name: Plan
        run: terraform plan -no-color -out=tfplan
      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -auto-approve tfplan
